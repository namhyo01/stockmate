# 맥에서 상시 실행. Docker Desktop이 켜지면 컨테이너도 자동으로 다시 뜬다.
services:
  stockmate:
    build: .
    image: stockmate:latest
    container_name: stockmate
    restart: unless-stopped
    env_file: .env
    # 맥의 DNS 캐시를 거치지 않는다: 인터넷이 잠깐 끊겼다 돌아오면 맥이 "없는 주소"라는 답을 한동안 기억해서
    # 한투 API 주소만 계속 못 찾은 적이 있다 (2026-11-10)
    dns:
      - 1.1.1.1
      - 8.8.8.8
    ports:
      - "127.0.0.1:8000:8000"   # 외부 공개는 tailscale serve로만
    volumes:
      - .:/app                  # 코드와 data/를 그대로 쓴다 (코드 수정 후 docker compose restart)
