[project]
name = "stockmate"
version = "0.1.0"
description = "여러 증권사 계좌를 통합 관리하고 AI로 분석하는 개인 투자 비서"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "sqlalchemy>=2.0",
    "pydantic-settings>=2.0",
    "typer>=0.12",
    "rich>=13.0",
    "finance-datareader>=0.9.90",
    "yfinance>=0.2.50",
    "httpx>=0.28.1",
    "fastapi>=0.142.2",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
stock = "stockmate.cli:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/stockmate"]

[tool.pytest.ini_options]
testpaths = ["tests"]
